name: Test

# 只跑测试，不发布。发布改为手动：确认测试绿后自己打 tgz、自己传。
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'CYyare/dsh-purge'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 语法门禁
        run: |
          set -e
          for f in $(git ls-files '*.js' '*.mjs'); do node --check "$f"; done

      - name: 夹具回归（npm test）
        run: |
          npm install --no-audit --no-fund
          npm test
